{% extends "base.html" %}

{% block content %}
<div class="flex min-h-[calc(100vh-200px)] items-center justify-center py-12 px-4 sm:px-6 lg:px-8 bg-gray-50/50">
    <div class="w-full max-w-md space-y-8 bg-white p-8 rounded-2xl shadow-xl border border-gray-100">
        <div>
            <div
                class="mx-auto flex h-16 w-16 items-center justify-center rounded-full bg-primary/10 text-primary shadow-lg shadow-primary/20 animate-bounce-short">
                <span class="material-symbols-outlined text-3xl">lock</span>
            </div>
            <h2 class="mt-6 text-center text-3xl font-black tracking-tight text-secondary">
                Iniciar Sesión
            </h2>
            <p class="mt-2 text-center text-sm text-gray-500">
                Accede a tu cuenta de <span class="font-bold text-primary">GuiriExperience</span>
            </p>
        </div>
        <form class="mt-8 space-y-6" method="POST">
            <div class="-space-y-px rounded-md shadow-sm">
                <div class="mb-4">
                    <label for="username" class="sr-only">Usuario</label>
                    <div class="relative">
                        <div class="pointer-events-none absolute inset-y-0 left-0 flex items-center pl-3 text-gray-400">
                            <span class="material-symbols-outlined">person</span>
                        </div>
                        <input id="username" name="username" type="text" required
                            class="relative block w-full rounded-xl border-gray-200 py-3 pl-10 text-gray-900 placeholder:text-gray-400 focus:z-10 focus:border-primary focus:ring-primary shadow-sm sm:text-sm sm:leading-6 transition-all"
                            placeholder="Nombre de usuario">
                    </div>
                </div>
                <div>
                    <label for="password" class="sr-only">Contraseña</label>
                    <div class="relative">
                        <div class="pointer-events-none absolute inset-y-0 left-0 flex items-center pl-3 text-gray-400">
                            <span class="material-symbols-outlined">key</span>
                        </div>
                        <input id="password" name="password" type="password" required
                            class="relative block w-full rounded-xl border-gray-200 py-3 pl-10 text-gray-900 placeholder:text-gray-400 focus:z-10 focus:border-primary focus:ring-primary shadow-sm sm:text-sm sm:leading-6 transition-all"
                            placeholder="Contraseña">
                    </div>
                </div>
            </div>

            <div>
                <button type="submit"
                    class="group relative flex w-full justify-center rounded-xl bg-primary px-3 py-3 text-sm font-bold text-white shadow-lg shadow-primary/30 hover:bg-primary/90 hover:scale-[1.02] focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary transition-all">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3">
                        <span
                            class="material-symbols-outlined h-5 w-5 text-white/50 group-hover:text-white transition-colors">login</span>
                    </span>
                    Entrar
                </button>
            </div>

            <div class="text-center text-sm">
                <a href="{{ url_for('register') }}"
                    class="font-medium text-secondary hover:text-primary transition-colors">
                    ¿No tienes cuenta? <span
                        class="font-bold underline decoration-2 decoration-primary/30 hover:decoration-primary">Regístrate
                        aquí</span>
                </a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
