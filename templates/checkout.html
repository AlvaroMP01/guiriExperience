{% extends 'base.html' %}

{% block content %}
<div class="container">
    <a href="javascript:history.back()" class="btn" style="margin-bottom: 2rem; background: #95a5a6;">&larr; Back</a>

    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 3rem; align-items: start;">

        <!-- Order Summary -->
        <div class="card" style="padding: 2rem;">
            <h2 style="margin-bottom: 1.5rem; color: var(--primary);">Order Summary</h2>
            <div style="display: flex; gap: 1rem; margin-bottom: 1.5rem;">
                <img src="{{ url_for('static', filename='uploads/' + service.imagen) if service.imagen else 'https://via.placeholder.com/150' }}"
                    style="width: 100px; height: 100px; object-fit: cover; border-radius: 8px;">
                <div>
                    <h3 style="margin-bottom: 0.5rem;">{{ service.titulo if type == 'experience' else service.nombre }}
                    </h3>
                    <p style="color: #666; font-size: 0.9rem;">{{ service.ubicacion }}</p>
                </div>
            </div>

            <div
                style="border-top: 1px solid #eee; border-bottom: 1px solid #eee; padding: 1rem 0; margin-bottom: 1rem;">
                <div style="display: flex; justify-content: space-between; margin-bottom: 0.5rem;">
                    <span>Date:</span>
                    <span style="font-weight: 600;">{{ date }}</span>
                </div>
                <div style="display: flex; justify-content: space-between; margin-bottom: 0.5rem;">
                    <span>Participants/Guests:</span>
                    <span style="font-weight: 600;">{{ quantity }}</span>
                </div>
                <div style="display: flex; justify-content: space-between; margin-bottom: 0.5rem;">
                    <span>Price per unit:</span>
                    <span>{{ price }}€</span>
                </div>
            </div>

            <div
                style="display: flex; justify-content: space-between; font-size: 1.5rem; font-weight: bold; color: var(--secondary);">
                <span>Total:</span>
                <span>{{ total }}€</span>
            </div>
        </div>

        <!-- Payment Form -->
        <div class="card" style="padding: 2rem;">
            <h2 style="margin-bottom: 1.5rem; color: var(--primary);">Payment Details</h2>
            <form action="{{ url_for('process_payment') }}" method="POST">
                <!-- Hidden fields to pass data to backend -->
                <input type="hidden" name="service_id" value="{{ service.id }}">
                <input type="hidden" name="type" value="{{ type }}">
                <input type="hidden" name="date" value="{{ date }}">
                <input type="hidden" name="quantity" value="{{ quantity }}">
                <input type="hidden" name="total" value="{{ total }}">

                <div style="margin-bottom: 1.5rem;">
                    <label style="display: block; margin-bottom: 0.5rem; font-weight: 600;">Full Name</label>
                    <input type="text" name="fullname" required placeholder="John Doe"
                        style="width: 100%; padding: 0.8rem; border: 1px solid #ddd; border-radius: 8px;">
                </div>

                <div style="margin-bottom: 1.5rem;">
                    <label style="display: block; margin-bottom: 0.5rem; font-weight: 600;">Email Address</label>
                    <input type="email" name="email" required placeholder="john@example.com"
                        style="width: 100%; padding: 0.8rem; border: 1px solid #ddd; border-radius: 8px;">
                </div>

                <div style="margin-bottom: 1.5rem;">
                    <label style="display: block; margin-bottom: 0.5rem; font-weight: 600;">Card Number</label>
                    <div style="position: relative;">
                        <input type="text" required placeholder="0000 0000 0000 0000" maxlength="19"
                            style="width: 100%; padding: 0.8rem; border: 1px solid #ddd; border-radius: 8px; letter-spacing: 2px;">
                        <i class="fas fa-credit-card"
                            style="position: absolute; right: 15px; top: 15px; color: #aaa;"></i>
                    </div>
                </div>

                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-bottom: 2rem;">
                    <div>
                        <label style="display: block; margin-bottom: 0.5rem; font-weight: 600;">Expiry Date</label>
                        <input type="text" required placeholder="MM/YY" maxlength="5"
                            style="width: 100%; padding: 0.8rem; border: 1px solid #ddd; border-radius: 8px;">
                    </div>
                    <div>
                        <label style="display: block; margin-bottom: 0.5rem; font-weight: 600;">CVV</label>
                        <input type="text" required placeholder="123" maxlength="3"
                            style="width: 100%; padding: 0.8rem; border: 1px solid #ddd; border-radius: 8px;">
                    </div>
                </div>

                <button type="submit" class="btn" style="width: 100%; font-size: 1.2rem;">
                    Pay {{ total }}€ & Confirm
                </button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
