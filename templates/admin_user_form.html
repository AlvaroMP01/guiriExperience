{% extends "base.html" %}

{% block content %}
<div class="py-12 px-6">
    <div class="mx-auto max-w-3xl">
        <a href="{{ url_for('user_dashboard') }}"
            class="inline-flex items-center gap-2 mb-8 text-gray-500 hover:text-primary font-bold transition-colors">
            <span class="material-symbols-outlined">arrow_back</span> Volver a Lista de Usuarios
        </a>

        <div class="bg-white rounded-2xl shadow-xl overflow-hidden border border-gray-100">
            <div class="bg-secondary p-8 text-center text-white">
                <h2 class="text-3xl font-black mb-2">{{ action }} Usuario</h2>
                <p class="opacity-80">Complete la información para gestionar el acceso.</p>
            </div>

            <form method="POST" class="p-8 space-y-8">
                <!-- Account Info -->
                <div class="space-y-6 pb-8 border-b border-gray-100">
                    <h3 class="text-sm font-bold text-gray-400 uppercase tracking-wider mb-4">Credenciales</h3>

                    <div>
                        <label for="username" class="block text-sm font-bold text-gray-700 mb-2">Nombre de
                            Usuario</label>
                        <div class="relative">
                            <span class="material-symbols-outlined absolute left-4 top-3 text-gray-400">person</span>
                            <input type="text" id="username" name="username" value="{{ user.username if user else '' }}"
                                placeholder="Ej. usuario123" required
                                class="w-full pl-12 pr-4 py-3 rounded-xl border-gray-200 focus:border-primary focus:ring-primary shadow-sm outline-none transition-all">
                        </div>
                    </div>

                    <div>
                        <label for="email" class="block text-sm font-bold text-gray-700 mb-2">Correo Electrónico</label>
                        <div class="relative">
                            <span class="material-symbols-outlined absolute left-4 top-3 text-gray-400">mail</span>
                            <input type="email" id="email" name="email" value="{{ user.email if user else '' }}"
                                placeholder="Ej. correo@ejemplo.com"
                                class="w-full pl-12 pr-4 py-3 rounded-xl border-gray-200 focus:border-primary focus:ring-primary shadow-sm outline-none transition-all">
                        </div>
                    </div>

                    <div>
                        <label for="password" class="block text-sm font-bold text-gray-700 mb-2">
                            Contraseña
                            {% if action == 'Edit' %}
                            <span class="text-xs font-normal text-gray-400 ml-2">(Dejar en blanco para mantener
                                actual)</span>
                            {% endif %}
                        </label>
                        <div class="relative">
                            <span class="material-symbols-outlined absolute left-4 top-3 text-gray-400">lock</span>
                            <input type="password" id="password" name="password" placeholder="••••••••" {{ 'required' if
                                action=='Create' else '' }}
                                class="w-full pl-12 pr-4 py-3 rounded-xl border-gray-200 focus:border-primary focus:ring-primary shadow-sm outline-none transition-all">
                        </div>
                    </div>
                </div>

                <!-- Roles -->
                <div class="space-y-6">
                    <h3 class="text-sm font-bold text-gray-400 uppercase tracking-wider mb-4">Rol del Usuario</h3>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <!-- User Role -->
                        <label class="cursor-pointer relative group">
                            <input type="radio" name="role" value="USER" class="peer sr-only" {% if not user or (user
                                and user.role=='USER' ) %}checked{% endif %}>
                            <div
                                class="p-4 rounded-xl border-2 border-gray-100 hover:border-primary/50 bg-white peer-checked:border-primary peer-checked:bg-primary/5 transition-all h-full flex items-center gap-4">
                                <div
                                    class="w-12 h-12 rounded-full bg-gray-100 flex items-center justify-center text-gray-500 peer-checked:bg-primary peer-checked:text-white transition-colors">
                                    <span class="material-symbols-outlined">person</span>
                                </div>
                                <div>
                                    <span class="font-bold text-secondary block">Usuario</span>
                                    <span class="text-xs text-gray-500 block">Acceso solo a reservas</span>
                                </div>
                            </div>
                        </label>

                        <!-- Provider Role (Group 2) -->
                        <label class="cursor-pointer relative group">
                            <input type="radio" name="role" value="PROVIDER" class="peer sr-only" {% if user and
                                user.role=='PROVIDER' %}checked{% endif %}>
                            <div
                                class="p-4 rounded-xl border-2 border-gray-100 hover:border-primary/50 bg-white peer-checked:border-primary peer-checked:bg-primary/5 transition-all h-full flex items-center gap-4">
                                <div
                                    class="w-12 h-12 rounded-full bg-gray-100 flex items-center justify-center text-gray-500 peer-checked:bg-primary peer-checked:text-white transition-colors">
                                    <span class="material-symbols-outlined">deck</span>
                                </div>
                                <div>
                                    <span class="font-bold text-secondary block">Proveedor</span>
                                    <span class="text-xs text-gray-500 block">Gestión Exp/Hoteles/Casas</span>
                                </div>
                            </div>
                        </label>

                        <!-- Seller Role (Group 1) -->
                        <label class="cursor-pointer relative group">
                            <input type="radio" name="role" value="TOUR_SELLER" class="peer sr-only" {% if user and
                                user.role=='TOUR_SELLER' %}checked{% endif %}>
                            <div
                                class="p-4 rounded-xl border-2 border-gray-100 hover:border-primary/50 bg-white peer-checked:border-primary peer-checked:bg-primary/5 transition-all h-full flex items-center gap-4">
                                <div
                                    class="w-12 h-12 rounded-full bg-gray-100 flex items-center justify-center text-gray-500 peer-checked:bg-primary peer-checked:text-white transition-colors">
                                    <span class="material-symbols-outlined">commute</span>
                                </div>
                                <div>
                                    <span class="font-bold text-secondary block">Vendedor Transporte</span>
                                    <span class="text-xs text-gray-500 block">Gestión Tours/Bus/Tren</span>
                                </div>
                            </div>
                        </label>

                        <!-- Admin Role -->
                        <label class="cursor-pointer relative group">
                            <input type="radio" name="role" value="ADMIN" class="peer sr-only" {% if user and
                                user.role=='ADMIN' %}checked{% endif %}>
                            <div
                                class="p-4 rounded-xl border-2 border-gray-100 hover:border-primary/50 bg-white peer-checked:border-primary peer-checked:bg-primary/5 transition-all h-full flex items-center gap-4">
                                <div
                                    class="w-12 h-12 rounded-full bg-gray-100 flex items-center justify-center text-gray-500 peer-checked:bg-primary peer-checked:text-white transition-colors">
                                    <span class="material-symbols-outlined">admin_panel_settings</span>
                                </div>
                                <div>
                                    <span class="font-bold text-secondary block">Administrador</span>
                                    <span class="text-xs text-gray-500 block">Acceso Total</span>
                                </div>
                            </div>
                        </label>
                    </div>
                </div>

                <!-- Submit -->
                <div class="flex items-center justify-end gap-4 pt-8 border-t border-gray-100">
                    <a href="{{ url_for('user_dashboard') }}"
                        class="px-6 py-3 rounded-xl font-bold text-gray-500 hover:bg-gray-100 transition-colors">Cancelar</a>
                    <button type="submit"
                        class="flex items-center gap-2 bg-primary text-white px-8 py-3 rounded-xl font-bold hover:scale-105 transition-transform shadow-lg shadow-primary/30">
                        <span class="material-symbols-outlined">save</span>
                        Guardar Usuario
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
