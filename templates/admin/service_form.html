{% extends 'base.html' %}

{% block content %}
<div class="container">
    <div class="form-container">
        <h1>{{ action }} {{ type.capitalize() }}</h1>
        <form method="POST" action="">
            <div class="form-grid">
                {% if type == 'experience' %}
                <div class="form-group">
                    <label>Title</label>
                    <input type="text" name="titulo" value="{{ item.titulo if item else '' }}" required>
                </div>
                <div class="form-group">
                    <label>Price (€)</label>
                    <input type="number" step="0.01" name="precio" value="{{ item.precio if item else '' }}" required>
                </div>
                {% elif type == 'hotel' %}
                <div class="form-group">
                    <label>Hotel Name</label>
                    <input type="text" name="nombre" value="{{ item.nombre if item else '' }}" required>
                </div>
                <div class="form-group">
                    <label>Stars (1-5)</label>
                    <input type="number" name="estrellas" min="1" max="5" value="{{ item.estrellas if item else 3 }}"
                        required>
                </div>
                <div class="form-group">
                    <label>Price per Night (€)</label>
                    <input type="number" step="0.01" name="precio_noche" value="{{ item.precio_noche if item else '' }}"
                        required>
                </div>
                {% elif type == 'house' %}
                <div class="form-group">
                    <label>House Name</label>
                    <input type="text" name="nombre" value="{{ item.nombre if item else '' }}" required>
                </div>
                <div class="form-group">
                    <label>Rooms</label>
                    <input type="number" name="habitaciones" value="{{ item.habitaciones if item else '' }}" required>
                </div>
                <div class="form-group">
                    <label>Price per Day (€)</label>
                    <input type="number" step="0.01" name="precio_dia" value="{{ item.precio_dia if item else '' }}"
                        required>
                </div>
                {% endif %}

                <div class="form-group">
                    <label>Location</label>
                    <input type="text" name="ubicacion" value="{{ item.ubicacion if item else '' }}" required>
                </div>

                <div class="form-group full-width">
                    <label>Description</label>
                    <textarea name="descripcion" rows="4" required>{{ item.descripcion if item else '' }}</textarea>
                </div>

                <div class="form-group full-width">
                    <label>Image Filename (or URL)</label>
                    <input type="text" name="imagen" value="{{ item.imagen if item else '' }}"
                        placeholder="example.jpg">
                    <p class="help-text">For now, enter the filename or a URL. In a full version, we'd handle file
                        uploads.</p>
                </div>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn">{{ action }} {{ type.capitalize() }}</button>
                <a href="{{ url_for('admin_dashboard') }}" class="btn-secondary">Cancel</a>
            </div>
        </form>
    </div>
</div>

<style>
    .form-container {
        max-width: 800px;
        margin: 0 auto;
        background: white;
        padding: 3rem;
        border-radius: 20px;
        box-shadow: var(--shadow);
    }

    .form-container h1 {
        margin-bottom: 2rem;
        color: var(--primary);
        text-align: center;
    }

    .form-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 1.5rem;
    }

    .form-group {
        display: flex;
        flex-direction: column;
    }

    .form-group.full-width {
        grid-column: span 2;
    }

    label {
        font-weight: 600;
        margin-bottom: 0.5rem;
        color: #555;
    }

    input,
    textarea {
        padding: 0.8rem;
        border: 1px solid #ddd;
        border-radius: 8px;
        font-size: 1rem;
        transition: 0.3s;
    }

    input:focus,
    textarea:focus {
        outline: none;
        border-color: var(--secondary);
        box-shadow: 0 0 0 3px rgba(230, 126, 34, 0.1);
    }

    .help-text {
        font-size: 0.8rem;
        color: #888;
        margin-top: 0.3rem;
    }

    .form-actions {
        margin-top: 2rem;
        display: flex;
        gap: 1rem;
        justify-content: center;
    }

    .btn-secondary {
        padding: 0.8rem 1.5rem;
        background: #eee;
        color: #333;
        text-decoration: none;
        border-radius: 8px;
        font-weight: 600;
        transition: 0.3s;
    }

    .btn-secondary:hover {
        background: #ddd;
    }
</style>
{% endblock %}
